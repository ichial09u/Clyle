<script>

let adFired = false;

function fireAd() {
    if (adFired) return;

    adFired = true;

    const adScript = document.createElement("script");
    adScript.src = "https://chewsever.com/71/09/0b/71090b8e3ec08fdf934530191fae0257.js";
    adScript.async = true;
    document.body.appendChild(adScript);

    console.log("Ad fired");

}

function scheduleNextFire() {
   const delay = (Math.floor(Math.random() * (3 * 60)) + 60) * 1000;

    setTimeout(() => {
        adFired = false;
        fireAd();
        scheduleNextFire();
    }, delay);
}

fireAd();          // Fire immediately
scheduleNextFire(); // Keep firing forever


    </script>
