<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<title>Clyle</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    padding: 24px;
  }
  .card { width: 100%; max-width: 380px; }
  .logo { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin-bottom: 18px; text-align: center; }
  .logo.left { text-align: left; margin-bottom: 4px; }
  .logo span { color: #d32f2f; }
  .sub { color: #9a9a9a; font-size: 14px; margin-bottom: 26px; line-height: 1.45; }
  label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #bdbdbd; margin-bottom: 7px; text-transform: uppercase; }
  input {
    width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 10px;
    border: 1.5px solid #333; background: #161616; color: #fff; outline: none;
  }
  input:focus { border-color: #d32f2f; }
  .hint { color: #6f6f6f; font-size: 12px; margin-top: 8px; line-height: 1.5; }
  button {
    width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 999px;
    background: #fff; color: #000; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .err { color: #ff6b6b; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .boot { text-align: center; }
  .spin {
    width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid #2c2c2c; border-top-color: #d32f2f; animation: r 0.9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .hidden { display: none; }
  a { color: #8a8a8a; font-size: 12px; }
</style>
</head>
<body>
  <!-- launch: auto-connects to the baked-in server, no input ever requested -->
  <div id="boot" class="card boot">
    <div class="logo">Clyle<span>.</span></div>
    <div class="spin"></div>
    <div id="bootMsg" style="font-weight:800;font-size:16px">Opening Clyle…</div>
    <div id="bootUrl" style="color:#7a7a7a;font-size:12px;margin-top:6px;word-break:break-all"></div>
    <p style="margin-top:22px"><a href="#" id="changeLink">Change server</a></p>
  </div>

  <!-- fallback: only shown if the baked-in server is unreachable -->
  <div id="setup" class="card hidden">
    <div class="logo left">Clyle<span>.</span></div>
    <p class="sub">Couldn't reach the Clyle server. Paste a server address — it stays on this phone.</p>
    <form id="form">
      <label for="url">Server URL</label>
      <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://your-clyle-server.example" />
      <div class="err" id="err"></div>
      <button id="go" type="submit">Connect</button>
    </form>
  </div>

<script>
(function () {
  // ================= BAKED AT BUILD TIME =================
  // The APK opens straight into this server. Filled with the Render URL
  // before building the release APK — never Vercel.
  var DEFAULT_SERVER = "https://clyle.onrender.com";
  // ========================================================

  var KEY = "clyle.server";      // manual override saved on this phone
  var WINDOW_MS = 40000;         // patience per attempt (Render cold starts ~30-60s)
  var MAX_ATTEMPTS = 3;          // ~2 min total before asking for a URL

  var boot = document.getElementById("boot");
  var setup = document.getElementById("setup");
  var bootMsg = document.getElementById("bootMsg");
  var bootUrl = document.getElementById("bootUrl");
  var input = document.getElementById("url");
  var err = document.getElementById("err");
  var go = document.getElementById("go");
  var form = document.getElementById("form");

  function showSetup(msg) {
    boot.classList.add("hidden");
    setup.classList.remove("hidden");
    input.value = localStorage.getItem(KEY) || DEFAULT_SERVER || "";
    if (msg) err.textContent = msg;
  }

  function enter(url) {
    location.replace(url); // replace so back button exits the app instead of bouncing here
  }

  // Opaque no-cors probe: resolves whenever the host answers at all
  // (any status), rejects only on network failure. /api/health is ideal
  // but any path works — a 404 still resolves and lets the app handle it.
  function probe(url, onDone) {
    var settled = false;
    var to = setTimeout(function () {
      if (!settled) { settled = true; onDone(false); }
    }, WINDOW_MS);
    fetch(url.replace(/\/+$/, "") + "/api/health", { mode: "no-cors", cache: "no-store" })
      .then(function () { if (!settled) { settled = true; clearTimeout(to); onDone(true); } })
      .catch(function () { if (!settled) { settled = true; clearTimeout(to); onDone(false); } });
  }

  function launch(url, fallback) {
    bootUrl.textContent = url;
    var attempts = 0;
    var msgs = ["Opening Clyle…", "Waking the server up…", "Still connecting…"];
    (function attempt() {
      bootMsg.textContent = msgs[Math.min(attempts, msgs.length - 1)];
      attempts++;
      probe(url, function (ok) {
        if (ok) { localStorage.setItem(KEY, url.replace(/\/+$/, "")); return enter(url); }
        if (fallback) {
          var f = fallback; fallback = null;
          // stale/broken override (e.g. dead old host): forget it, use baked default
          bootMsg.textContent = "Switching to the Clyle server…";
          localStorage.removeItem(KEY);
          return launch(f, null);
        }
        if (attempts < MAX_ATTEMPTS) return setTimeout(attempt, 1500);
        showSetup("Can't reach " + url + " — the server may be waking up. Try again shortly or check the address.");
      });
    })();
  }

  document.getElementById("changeLink").addEventListener("click", function (e) {
    e.preventDefault();
    showSetup();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var url = input.value.trim().replace(/\/+$/, "");
    if (!/^https?:\/\//i.test(url)) {
      err.textContent = "URL must start with http:// or https://";
      return;
    }
    go.disabled = true;
    err.textContent = "";
    go.textContent = "Checking…";
    probe(url, function (ok) {
      go.disabled = false;
      go.textContent = "Connect";
      if (!ok) {
        err.textContent = "No response in 40s — it may still be waking up. Try again, or double-check the address.";
        return;
      }
      localStorage.setItem(KEY, url);
      setup.classList.add("hidden");
      boot.classList.remove("hidden");
      enter(url);
    });
  });

  // ===== boot =====
  var saved = localStorage.getItem(KEY);
  var target = saved || DEFAULT_SERVER;
  // A dead manual override must not brick the app: fall back to the baked default.
  var fallback = (saved && DEFAULT_SERVER && saved !== DEFAULT_SERVER) ? DEFAULT_SERVER : null;
  if (target) {
    launch(target, fallback);
  } else {
    showSetup();
  }
})();
</script>
</body>
</html>
