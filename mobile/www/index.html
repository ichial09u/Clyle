<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<title>Clyle</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    padding: 24px;
  }
  .card { width: 100%; max-width: 380px; }
  .logo { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin-bottom: 4px; }
  .logo span { color: #d32f2f; }
  .sub { color: #9a9a9a; font-size: 14px; margin-bottom: 26px; line-height: 1.45; }
  label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #bdbdbd; margin-bottom: 7px; text-transform: uppercase; }
  input {
    width: 100%; padding: 13px 14px; font-size: 15px; border-radius: 10px;
    border: 1.5px solid #333; background: #161616; color: #fff; outline: none;
  }
  input:focus { border-color: #d32f2f; }
  .hint { color: #6f6f6f; font-size: 12px; margin-top: 8px; line-height: 1.5; }
  button {
    width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 999px;
    background: #fff; color: #000; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .err { color: #ff6b6b; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .boot { text-align: center; }
  .spin {
    width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid #2c2c2c; border-top-color: #d32f2f; animation: r 0.9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .hidden { display: none; }
  a { color: #8a8a8a; font-size: 12px; }
</style>
</head>
<body>
  <!-- boot: trying the saved server -->
  <div id="boot" class="card boot">
    <div class="spin"></div>
    <div style="font-weight:800;font-size:17px">Connecting to Clyle…</div>
    <div id="bootUrl" style="color:#7a7a7a;font-size:12px;margin-top:6px;word-break:break-all"></div>
    <p style="margin-top:22px"><a href="#" id="changeLink">Change server</a></p>
  </div>

  <!-- setup: first run / server unreachable -->
  <div id="setup" class="card hidden">
    <div class="logo">Clyle<span>.</span></div>
    <p class="sub">Paste your Clyle server address — the same URL you open in the browser. It stays on this phone.</p>
    <form id="form">
      <label for="url">Server URL</label>
      <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://your-clyle-server.example" />
      <div class="hint">Tip: open Clyle in your phone's browser, copy the address from the bar, paste it here.</div>
      <div class="err" id="err"></div>
      <button id="go" type="submit">Connect</button>
    </form>
  </div>

<script>
(function () {
  var KEY = "clyle.server";
  var boot = document.getElementById("boot");
  var setup = document.getElementById("setup");
  var bootUrl = document.getElementById("bootUrl");
  var input = document.getElementById("url");
  var err = document.getElementById("err");
  var go = document.getElementById("go");
  var form = document.getElementById("form");

  function showSetup() {
    boot.classList.add("hidden");
    setup.classList.remove("hidden");
    input.value = localStorage.getItem(KEY) || "";
  }

  function enter(url) {
    localStorage.setItem(KEY, url);
    // replace so back button exits the app instead of bouncing here
    location.replace(url);
  }

  function check(url, cb) {
    fetch(url.replace(/\/+$/, "") + "/api/health", { mode: "no-cors" })
      .then(function () { cb(true, null); })
      .catch(function (e) {
        // opaque no-cors responses reject only on network failure — any
        // resolve means the host exists; let the app itself 404-gracefully
        cb(true, null);
      });
  }

  document.getElementById("changeLink").addEventListener("click", function (e) {
    e.preventDefault();
    showSetup();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var url = input.value.trim();
    if (!/^https?:\/\//i.test(url)) {
      err.textContent = "URL must start with http:// or https://";
      return;
    }
    go.disabled = true;
    err.textContent = "";
    check(url, function () { enter(url.replace(/\/+$/, "")); });
  });

  // auto-boot with the saved server
  var saved = localStorage.getItem(KEY);
  if (saved) {
    bootUrl.textContent = saved;
    var t = setTimeout(showSetup, 6000); // dead server -> setup after 6s
    check(saved, function (ok) {
      clearTimeout(t);
      enter(saved);
    });
  } else {
    showSetup();
  }
})();
</script>
</body>
</html>
